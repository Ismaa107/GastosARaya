# Nombre de la aplicación (Spring Initializr).
spring.application.name=gastos-a-raya

# Perfil activo: Spring carga también application-local.properties,
# con los datos de conexión de cada equipo. Ese archivo no va a GitHub.
spring.profiles.active=local

# Las tablas las crea Flyway con los scripts de db/migration.
# "validate": Hibernate solo comprueba que las entidades coinciden con las
# tablas; si no coinciden, la aplicación no arranca.
spring.jpa.hibernate.ddl-auto=validate
